<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minion Moon Heist</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="controls">
    <button id="spawnBtn">Send Swarm</button>
    <label>Minion Count: <input id="count" type="number" min="1" max="200" value="30"></label>
  </div>

  <div class="stars" aria-hidden="true"></div>

  <div id="stage" class="stage" aria-hidden="true">
    <div class="moon" aria-hidden="true">
      <div class="crater c1"></div>
      <div class="crater c2"></div>
      <div class="crater c3"></div>
      <div class="crater c4"></div>
      <div class="crater c5"></div>
      <div class="crater c6"></div>
      <div class="crater c7"></div>
      <div class="crater c8"></div>

      <div class="flag" role="img" aria-label="flag">
        <div class="pole" aria-hidden="true"></div>
        <div class="triangle"><span class="label">Poopaye, Earth!</span></div>
      </div>

      <div class="craterRing r1"></div>
      <div class="craterRing r2"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
